name: Frontend CI

on:
  push:
    branches: [main, step12-production-readiness]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: frontend/reading_sanctuary_app
        run: flutter pub get

      - name: Run Static Analysis
        working-directory: frontend/reading_sanctuary_app
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: frontend/reading_sanctuary_app
        run: flutter test

      - name: Build Web Release Bundle
        working-directory: frontend/reading_sanctuary_app
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.readingsanctuary.com
