name: Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test Backend
        working-directory: backend/reading-sanctuary-api
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Test Frontend
        working-directory: frontend/reading_sanctuary_app
        run: |
          flutter pub get
          flutter test

  deploy-backend:
    name: Build & Deploy Backend Container
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: reading-sanctuary-api
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend/reading-sanctuary-api
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS Fargate
        run: |
          aws ecs update-service --cluster reading-sanctuary-cluster --service reading-sanctuary-api-service --force-new-deployment

  deploy-frontend:
    name: Build & Deploy Flutter Web
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Build Web Release
        working-directory: frontend/reading_sanctuary_app
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}

      - name: Sync to S3 Web Bucket
        working-directory: frontend/reading_sanctuary_app
        run: |
          aws s3 sync build/web/ s3://${{ secrets.AWS_WEB_S3_BUCKET }} --delete --cache-control "max-age=31536000,public" --exclude "index.html"
          aws s3 cp build/web/index.html s3://${{ secrets.AWS_WEB_S3_BUCKET }}/index.html --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
