spring.application.name=reading-sanctuary-api

server.port=${PORT:8080}

# Managed RDS PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Hibernate Production Validation
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Cloud Storage (AWS S3)
app.storage.provider=s3
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:us-east-1}
app.storage.s3.presigned-url-expiration-minutes=15

# Security & CORS
app.jwt.secret=${READING_SANCTUARY_JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://readingsanctuary.com,https://app.readingsanctuary.com}

# Actuator Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Upload limits
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Logging
logging.level.root=INFO
logging.level.com.readingsanctuary.api=INFO
