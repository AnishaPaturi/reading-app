spring.application.name=reading-sanctuary-api

# Optional local overrides for development (gitignored)
spring.config.import=optional:file:./application-local.properties

# Server Configuration
server.port=8080

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reading_sanctuary_db}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration
app.jwt.secret=${READING_SANCTUARY_JWT_SECRET}

# Local book file storage
app.storage.local-root=./reading-sanctuary-storage

# Cover image upload limit
app.storage.cover-max-size=5242880

# Maximum upload size
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

