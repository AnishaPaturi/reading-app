# Load local developer secrets from backend/reading-sanctuary-api/.env when present.
# Host/deployment environment variables can still override these values.
spring.config.import=optional:file:.env[.properties]

spring.application.name=reading-sanctuary-api
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/reading_sanctuary_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${READING_SANCTUARY_JWT_SECRET}

# Google OAuth: OAuth 2.0 Web application client ID (not client secret).
app.google.client-id=${GOOGLE_CLIENT_ID:test-client-id.apps.googleusercontent.com}

# Local book file storage
app.storage.local-root=./reading-sanctuary-storage
app.storage.cover-max-size=5242880
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
