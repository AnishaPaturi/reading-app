name: reading_sanctuary_app
description: Reading Sanctuary - your books, your thoughts, your sanctuary.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  docx_viewer: ^1.0.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  dio: ^5.8.0+1
  file_picker: ^10.3.3
  flutter_epub_viewer: ^2.2.1
  flutter_riverpod: ^2.5.1
  flutter_tts: ^4.2.5
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  http: ^1.6.0
  intl: ^0.19.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  pdfrx: ^2.4.8
  permission_handler: ^11.3.1
  crypto: ^3.0.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
